name: Production Operations Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check production homepage
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://ielts-kenyacenter.or.ke/ >/tmp/home.html
          grep -q 'IELTS Kenya Center' /tmp/home.html

      - name: Check production health and release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://ielts-kenyacenter.or.ke/api/_healthcheck >/tmp/health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True
          assert data.get('service') == 'ielts-kenya-center'
          assert isinstance(data.get('release'), str) and data['release']
          print('health ok; release=' + data['release'])
          PY

      - name: Check protected authentication boundary
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://ielts-kenyacenter.or.ke/api/admin/dashboard)
          test "$status" = "401"

      - name: Check Supabase availability
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          curl --fail --silent --show-error --max-time 20 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/courses?select=id&limit=1" >/dev/null

      - name: Check Resend sending domain
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$RESEND_API_KEY"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $RESEND_API_KEY" https://api.resend.com/domains >/tmp/resend-domains.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/resend-domains.json'))
          domain=next((d for d in data.get('data',[]) if d.get('name')=='ielts-kenyacenter.or.ke'),None)
          assert domain is not None
          assert domain.get('status') == 'verified'
          print('Resend sending domain verified')
          PY

      - name: Check latest main deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cloudflare.yml/runs?branch=main&per_page=1" >/tmp/deploy-runs.json
          python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/deploy-runs.json')).get('workflow_runs',[])
          assert runs
          run=runs[0]
          assert run.get('conclusion') == 'success', run.get('conclusion')
          print('latest main deployment succeeded: ' + run.get('head_sha','unknown'))
          PY

      - name: Check latest production smoke
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-smoke.yml/runs?branch=main&per_page=1" >/tmp/smoke-runs.json
          python3 - <<'PY'
          import json
          deploy=json.load(open('/tmp/deploy-runs.json'))['workflow_runs'][0]
          smoke=json.load(open('/tmp/smoke-runs.json'))['workflow_runs'][0]
          assert smoke.get('conclusion') == 'success', smoke.get('conclusion')
          assert smoke.get('head_sha') == deploy.get('head_sha'), {'deploy':deploy.get('head_sha'),'smoke':smoke.get('head_sha')}
          print('latest production smoke matches latest main deployment')
          PY
