name: Build and Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami
      - name: Build Cloudflare deployment output
        run: npm run build
      - name: Deploy Worker and static assets with production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          trap 'rm -f .secrets.production.json' EXIT
          python3 - <<'PY'
          import json, os
          with open('.secrets.production.json', 'w') as f:
              json.dump({
                  'SUPABASE_URL': os.environ['SUPABASE_URL'],
                  'SUPABASE_PUBLISHABLE_KEY': os.environ['SUPABASE_PUBLISHABLE_KEY'],
                  'SUPABASE_SECRET_KEY': os.environ['SUPABASE_SECRET_KEY'],
                  'RESEND_API_KEY': os.environ['RESEND_API_KEY'],
              }, f)
          PY
          npx wrangler deploy --var "RELEASE_ID:${{ github.sha }}" --secrets-file .secrets.production.json

      - name: Verify production domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            HOME_BODY="$(curl -fsS --max-time 15 https://ielts-kenyacenter.or.ke/ || true)"
            HEALTH_BODY="$(curl -fsS --max-time 15 https://ielts-kenyacenter.or.ke/api/_healthcheck || true)"

            if printf '%s' "$HOME_BODY" | grep -q "IELTS Kenya Center" \
               && printf '%s' "$HEALTH_BODY" | grep -q '"ok":true'; then
              echo "Production domain verification passed on attempt $attempt."
              exit 0
            fi

            echo "Production domain not ready yet; retry $attempt/12."
            sleep 10
          done

          echo "Production domain did not become healthy within the verification window."
          exit 1
