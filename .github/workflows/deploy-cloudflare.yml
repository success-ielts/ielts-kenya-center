name: Build and Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami
      - name: Build Cloudflare deployment output
        run: npm run build
      - name: Prepare apex DNS for Worker Custom Domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=ielts-kenyacenter.or.ke&status=active" | jq -r '.result[0].id // empty')
          test -n "$ZONE_ID"
          RECORDS=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=ielts-kenyacenter.or.ke&per_page=100")
          OLD_APPDEPLOY_ID=$(printf '%s' "$RECORDS" | jq -r '.result[] | select(.type == "A" and .content == "18.232.7.146") | .id' | head -n1)
          if [ -n "$OLD_APPDEPLOY_ID" ]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$OLD_APPDEPLOY_ID" >/dev/null
            echo "Removed only the old AppDeploy apex A record before attaching the Worker Custom Domain."
          fi
          REMAINING_CONFLICTS=$(printf '%s' "$RECORDS" | jq -r '.result[] | select((.type == "CNAME") or (.type == "AAAA") or (.type == "A" and .content != "18.232.7.146")) | [.type,.name,.content] | @tsv')
          if [ -n "$REMAINING_CONFLICTS" ]; then
            echo "Unexpected apex DNS records remain; refusing to alter them automatically:"
            printf '%s\n' "$REMAINING_CONFLICTS"
            exit 1
          fi
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set Supabase URL secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
      - name: Set Supabase publishable key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put SUPABASE_PUBLISHABLE_KEY
      - name: Set Resend API key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - name: Verify production domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 https://ielts-kenyacenter.or.ke/ | grep -q "IELTS Kenya Center"; then
              curl -fsS --max-time 15 https://ielts-kenyacenter.or.ke/api/_healthcheck | grep -q '"ok":true'
              echo "Production domain verification passed on attempt $attempt."
              exit 0
            fi
            echo "Production domain not ready yet; retry $attempt/12."
            sleep 10
          done
          echo "Production domain did not become healthy within the verification window."
          exit 1
