name: Production Functional Smoke

on:
  workflow_run:
    workflows: ["Build and Deploy to Cloudflare"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Narrow expected access-denied console diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/production-smoke-v2.mjs')
          text = path.read_text()
          old = "page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('401')){"
          new = "page.on('console',m=>{const text=m.text();const expectedAccessDeniedNavigation=/Failed to load resource: the server responded with a status of (401|403) \\(\\)/.test(text);if(m.type()==='error'&&!expectedAccessDeniedNavigation){"
          if old not in text:
              raise SystemExit('Expected smoke console diagnostic pattern not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run production smoke test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: https://ielts-kenyacenter.or.ke
        run: node tests/production-smoke-v2.mjs
